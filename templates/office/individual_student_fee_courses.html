{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V.V College Office - Select Course</title>
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .navbar-brand img { max-height: 48px; }
    </style>
</head>
<body class="bg-light">
    <header class="bg-white border-bottom shadow-sm">
        <div class="container">
            <nav class="navbar navbar-light">
                <a class="navbar-brand" href="{% url 'student_fee_management' %}">
                    <img src="{% static 'assets/img/logo.png' %}" alt="V.V Logo">
                </a>
                <div class="ms-auto d-flex align-items-center gap-2">
                    <span class="d-none d-sm-inline text-muted small">{{ office_staff.name }}</span>
                    <a href="{% url 'student_fee_management' %}" class="btn btn-outline-secondary btn-sm rounded-pill">
                        <i class="bi bi-arrow-left me-1"></i> Back
                    </a>
                </div>
            </nav>
        </div>
    </header>
    <main class="container py-5">
        <a href="{% url 'individual_student_fee_departments' semester %}" class="btn btn-outline-primary btn-sm mb-4"><i class="bi bi-arrow-left me-1"></i> Back to Departments</a>
        <h1 class="h3 fw-bold mb-1">Select Course</h1>
        <p class="text-muted mb-4">{{ department.dep }} - Semester {{ semester }}</p>
        <div class="row g-3">
            {% for course in courses %}
            <div class="col-12 col-sm-6 col-lg-4">
                <a href="{% url 'individual_student_fee_students' semester course.id %}" class="card card-body text-decoration-none text-dark shadow-sm h-100">
                    <span class="fw-bold">{{ course.course }}</span>
                    <span class="text-muted small mt-2">View students</span>
                </a>
            </div>
            {% empty %}
            <div class="alert alert-info">No courses found.</div>
            {% endfor %}
        </div>
    </main>
</body>
</html>
