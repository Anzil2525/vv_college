{% load static %}
<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>V.V College Office - {{ page_title }}</title>
    <link rel="stylesheet" href="{% static 'assets/css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'assets/css/style.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f4f7fa;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #334155;
        }

        .placeholder-card {
            max-width: 640px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 1rem;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body>
    <main class="container py-5 flex-grow-1 d-flex align-items-center justify-content-center">
        <section class="placeholder-card text-center p-4 p-sm-5">
            <i class="bi bi-hourglass-split text-primary display-4"></i>
            <h1 class="h3 fw-bold mt-3">{{ page_title }}</h1>
            <p class="text-muted">This page will be implemented later.</p>
            <a href="{% url 'student_fee_management' %}" class="btn btn-outline-secondary rounded-pill">
                <i class="bi bi-arrow-left me-1"></i> Back to Student Fees
            </a>
        </section>
    </main>
</body>
</html>
